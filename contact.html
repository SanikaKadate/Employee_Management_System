<html>
<head>
<style>
	body
	{
		background-color:color-mix(in hsl,purple,white);
	}
	button
	{
		background-color:lightgreen;
		height:40px;
		width:100px;
	}
</style>
</head>
<body>
	<fieldset style="background-color:white;height:37%;width:27%;margin-left:36%;margin-top:20%;box-shadow:10px 10px 20px black;">
	<form method="post">	
	<h1>
			Name  <br><input type="text" placeholder="Name" style="height:30px;width:100%;" required><br><br>
			
			Email  <br><input type="email" placeholder="Email" style="height:30px;width:100%;" required><br><br>

			Message <br> <textarea id="message" name="message" placeholder="Message" style="width:100%;height:150px;" required></textarea><br><br>
			
			<button style="margin-left:37%;" onclick="show();">Send</button>
	</h1>
	</form>
	</fieldset>
<script>
		function show()
		{
			alert("Your message is sent successfully!!");
		}
</script>
</body>
</html>
