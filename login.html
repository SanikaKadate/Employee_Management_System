<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" type="text/css" href="demo.css">
</head>
<body>
    <div class="container">
        <div class="image">
            <h1>Welcome To <span>WebMaster Solutions</span></h1>
        </div>
        <div class="content">
		  <form id="loginForm">
            <h1>Login Form</h1>
            <div class="form-group">
                <label for="">UserName</label>
                <br>
                <input type="text" class="form-control" name="" id="username" placeholder="UserName">
            </div>
            <div class="form-group">
                <label for="">Password</label>
                <br>
                <input type="password" class="form-control" name="" id="password" placeholder="Password">
            </div>
            <a class="fp" href="forgotpass.html">Forgot Password?</a>
            <br>
            <button type="submit" class="btn">Login</button>
		</form>
			</div>
	<div class="error" id="error-message"></div>
    </div>
<script>
    // Simple JavaScript validation for first-time login
    let isFirstLogin = true; // Assuming the admin is logging in for the first time

    const loginForm = document.getElementById('loginForm');
    const errorMessage = document.getElementById('error-message');

    loginForm.addEventListener('submit', function(event) {
        event.preventDefault(); // Prevent form submission for now

        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;

        // Check if the form is being submitted for the first time
        if (isFirstLogin) {
            if (username && password) {
                // Store the username and password (in a real scenario, use secure storage or server-side handling)
                localStorage.setItem('adminUsername', username);
                localStorage.setItem('adminPassword', password);
                alert("You have successfully logged in as admin!");
 
                isFirstLogin = false;
                alert("First-time login successful! Username and password have been set.");
            } else {
                alert("Please enter a valid username and password.");
            }
        } 
			else 
			{
					const adminUsername = localStorage.getItem('adminUsername');
        			const adminPassword = localStorage.getItem('adminPassword');
				if (adminUsername && adminPassword) {
            // Check if entered username and password match the saved credentials
            if (username === adminUsername && password === adminPassword) 
				{
                window.location.href="button2.html";
            } 
				else {
                alert("Incorrect username or password!");
            }
        } else {
            alert("No saved credentials found!");
        }
		}	
    });
</script>
</body>
</html>
